<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Bountly · Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d10; --surface:#15181d; --surface2:#1b1f26; --line:#262b33; --line2:#323843;
  --txt:#e7e9ea; --muted:#7d838d; --lime:#C6F24E; --red:#f4212e; --amber:#ff9f45; --blue:#1d9bf0;
  --mono:'JetBrains Mono',monospace; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit}
.mono{font-family:var(--mono)}

/* login */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.brand .m{width:34px;height:34px;border-radius:50%;background:var(--lime);display:grid;place-items:center}
.brand .m svg{width:60%}
.brand b{font-size:18px;font-weight:900;letter-spacing:-.02em}
.login-card h1{font-size:18px;margin-bottom:6px}
.login-card p{color:var(--muted);font-size:13px;margin-bottom:20px}
input,select{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 13px;font-family:var(--sans);font-size:14px;outline:none}
input:focus{border-color:var(--lime)}
.btn{font-family:var(--sans);font-weight:700;font-size:13px;border:none;cursor:pointer;padding:10px 16px;border-radius:9px;transition:.15s;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn-lime{background:var(--lime);color:#000}
.btn-out{background:transparent;border:1px solid var(--line2);color:var(--txt)}
.btn-sm{padding:7px 12px;font-size:12px}
.btn:active{transform:scale(.97)}
.err{color:var(--red);font-size:13px;margin-top:12px;min-height:18px}

/* app */
#app{display:none;max-width:1100px;margin:0 auto;padding:20px 18px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px}
.tabs button{font-family:var(--sans);font-weight:600;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:8px 15px;border-radius:99px;cursor:pointer}
.tabs button.active{background:var(--lime);color:#000;border-color:var(--lime)}
.panel{display:none}.panel.active{display:block}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat .v.lime{color:var(--lime)}.stat .v.amber{color:var(--amber)}.stat .v.red{color:var(--red)}
.stat .k{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:99px;font-weight:600}
.tag.live{color:var(--lime);background:rgba(198,242,78,.1)}
.tag.full{color:var(--red);background:rgba(244,33,46,.1)}
.tag.admin{color:var(--blue);background:rgba(29,155,240,.12)}
.tag.banned{color:var(--red);background:rgba(244,33,46,.12)}
.muted{color:var(--muted)}
.sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px}
h2.sec{font-size:16px;margin-bottom:14px}
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ledger .l{display:flex;justify-content:space-between;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line);font-size:13px}
.ledger .l:last-child{border-bottom:none}
.amt{font-weight:700}
.t-payout,.t-refund{color:var(--lime)} .t-fee,.t-commission{color:var(--amber)} .t-escrow{color:var(--blue)} .t-admin-adjust{color:var(--muted)}
video{width:100%;max-width:260px;border-radius:10px;margin-top:8px;background:#000}
.loading{color:var(--muted);text-align:center;padding:30px}
input[type=number]{width:90px;display:inline-block}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="brand"><span class="m"><svg viewBox="0 0 24 24" fill="none"><path d="M6 4h7a4 4 0 0 1 0 8H6zM6 12h8a4 4 0 0 1 0 8H6zM6 4v16" stroke="#000" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg></span><b>Bountly</b></div>
    <h1>Admin dashboard</h1>
    <p>Enter the dashboard password to continue.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <div style="height:12px"></div>
    <button class="btn btn-lime" id="login-btn" style="width:100%">Log in</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand"><span class="m"><svg viewBox="0 0 24 24" fill="none"><path d="M6 4h7a4 4 0 0 1 0 8H6zM6 12h8a4 4 0 0 1 0 8H6zM6 4v16" stroke="#000" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg></span><b>Bountly · Admin</b></div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn btn-out btn-sm" id="refresh">↻ Refresh</button>
      <button class="btn btn-out btn-sm" id="logout">Log out</button>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="active" data-p="overview">Overview</button>
    <button data-p="queue">Review</button>
    <button data-p="users">Users</button>
    <button data-p="dares">Dares</button>
    <button data-p="ledger">Ledger</button>
  </div>

  <div class="panel active" data-panel="overview" id="p-overview"><div class="loading">Loading…</div></div>
  <div class="panel" data-panel="queue" id="p-queue"><div class="loading">Loading…</div></div>
  <div class="panel" data-panel="users" id="p-users"><div class="loading">Loading…</div></div>
  <div class="panel" data-panel="dares" id="p-dares"><div class="loading">Loading…</div></div>
  <div class="panel" data-panel="ledger" id="p-ledger"><div class="loading">Loading…</div></div>
</div>

<script>
const $=s=>document.querySelector(s);
let TOKEN=localStorage.getItem('bountly_dash')||'';
let current='overview';

async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN,...(opts.headers||{})}});
  if(r.status===401){ logout(); throw new Error('Session expired — log in again'); }
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
  return d;
}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fdate=ms=>{const d=new Date(ms);return d.toLocaleDateString()+' '+d.toLocaleTimeString().slice(0,5);};

// ---- auth ----
async function login(){
  const pw=$('#pw').value; $('#login-err').textContent='';
  try{
    const r=await fetch('/api/dash/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error||'Login failed');
    TOKEN=d.token; localStorage.setItem('bountly_dash',TOKEN);
    showApp();
  }catch(e){ $('#login-err').textContent=e.message; }
}
function logout(){ TOKEN=''; localStorage.removeItem('bountly_dash'); $('#app').style.display='none'; $('#login').style.display='flex'; }
function showApp(){ $('#login').style.display='none'; $('#app').style.display='block'; load(current); }

$('#login-btn').onclick=login;
$('#pw').addEventListener('keydown',e=>{ if(e.key==='Enter') login(); });
$('#logout').onclick=logout;
$('#refresh').onclick=()=>load(current);
$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  current=b.dataset.p;
  $('#tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.dataset.panel===current));
  load(current);
});

function load(which){
  if(which==='overview') loadOverview();
  else if(which==='queue') loadQueue();
  else if(which==='users') loadUsers();
  else if(which==='dares') loadDares();
  else if(which==='ledger') loadLedger();
}

// ---- overview ----
async function loadOverview(){
  try{ const {overview:o}=await api('/api/dash/overview');
    $('#p-overview').innerHTML=`
      <div class="grid">
        <div class="stat"><div class="v lime">${o.creditsInPlay}</div><div class="k">Credits in play</div></div>
        <div class="stat"><div class="v">${o.users}</div><div class="k">Users</div></div>
        <div class="stat"><div class="v red">${o.banned}</div><div class="k">Banned</div></div>
        <div class="stat"><div class="v">${o.challenges}</div><div class="k">Dares total</div></div>
        <div class="stat"><div class="v lime">${o.open}</div><div class="k">Open dares</div></div>
        <div class="stat"><div class="v">${o.filled}</div><div class="k">Filled dares</div></div>
      </div>
      <div class="grid" style="margin-top:12px">
        <div class="stat"><div class="v amber">${o.pending}</div><div class="k">Pending review</div></div>
        <div class="stat"><div class="v">${o.approved}</div><div class="k">Approved</div></div>
        <div class="stat"><div class="v">${o.rejected}</div><div class="k">Rejected</div></div>
        <div class="stat"><div class="v lime">${o.paidOut}</div><div class="k">Paid out</div></div>
        <div class="stat"><div class="v amber">${o.fees}</div><div class="k">Fees earned</div></div>
        <div class="stat"><div class="v">${o.refunded}</div><div class="k">Refunded</div></div>
      </div>`;
  }catch(e){ $('#p-overview').innerHTML=`<div class="loading">${esc(e.message)}</div>`; }
}

// ---- queue / review ----
async function loadQueue(){
  try{ const {queue}=await api('/api/dash/queue');
    $('#p-queue').innerHTML=queue.length?queue.map((s,i)=>`
      <div class="card">
        <div class="row"><div><b>#${i+1} · ${esc(s.code)}</b><div class="sub">${esc(s.title)} · by @${esc(s.player)} · ${esc(s.file)}</div></div></div>
        ${s.video?`<video controls src="/uploads/${esc(s.video)}"></video>`:'<div class="sub">(no video file)</div>'}
        <div style="display:flex;gap:8px;margin-top:12px">
          <button class="btn btn-lime btn-sm" data-ap="${s.id}">Approve</button>
          <input id="rr-${s.id}" placeholder="reject reason" style="flex:1;min-width:120px">
          <button class="btn btn-out btn-sm" data-rj="${s.id}" style="border-color:var(--red);color:var(--red)">Reject</button>
        </div>
      </div>`).join(''):'<div class="loading">No proofs waiting for review. ✓</div>';
    $('#p-queue').querySelectorAll('[data-ap]').forEach(b=>b.onclick=async()=>{
      try{ const r=await api('/api/dash/approve/'+b.dataset.ap,{method:'POST'}); alert(r.winner?'Approved — winner paid!':'Approved (slot was taken)'); loadQueue(); }catch(e){alert(e.message);} });
    $('#p-queue').querySelectorAll('[data-rj]').forEach(b=>b.onclick=async()=>{
      const reason=$('#rr-'+b.dataset.rj).value.trim(); if(!reason) return alert('Enter a reject reason');
      try{ await api('/api/dash/reject/'+b.dataset.rj,{method:'POST',body:JSON.stringify({reason})}); loadQueue(); }catch(e){alert(e.message);} });
  }catch(e){ $('#p-queue').innerHTML=`<div class="loading">${esc(e.message)}</div>`; }
}

// ---- users ----
async function loadUsers(){
  try{ const {users}=await api('/api/dash/users');
    $('#p-users').innerHTML=users.map(x=>`
      <div class="card">
        <div class="row">
          <div><b>@${esc(x.username)}</b> ${x.isAdmin?'<span class="tag admin">admin</span>':''} ${x.banned?'<span class="tag banned">banned</span>':''}
            <div class="sub">id ${esc(x.id)} · ${x.credits} cr · ${x.wins} wins · ${x.posted} dares · ${x.subs} proofs · ${x.earned} cr earned</div></div>
        </div>
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
          <input type="number" id="cr-${x.id}" value="${x.credits}" ${x.isAdmin?'disabled':''}>
          <button class="btn btn-out btn-sm" data-cr="${x.id}" ${x.isAdmin?'disabled':''}>Set credits</button>
          ${x.isAdmin?'':`<button class="btn btn-sm ${x.banned?'btn-lime':'btn-out'}" data-ban="${x.id}">${x.banned?'Unban':'Ban'}</button>`}
        </div>
      </div>`).join('');
    $('#p-users').querySelectorAll('[data-cr]').forEach(b=>b.onclick=async()=>{
      const v=$('#cr-'+b.dataset.cr).value;
      try{ await api('/api/dash/credits/'+encodeURIComponent(b.dataset.cr),{method:'POST',body:JSON.stringify({credits:+v})}); loadUsers(); }catch(e){alert(e.message);} });
    $('#p-users').querySelectorAll('[data-ban]').forEach(b=>b.onclick=async()=>{
      try{ const r=await api('/api/dash/ban/'+encodeURIComponent(b.dataset.ban),{method:'POST'}); loadUsers(); }catch(e){alert(e.message);} });
  }catch(e){ $('#p-users').innerHTML=`<div class="loading">${esc(e.message)}</div>`; }
}

// ---- dares ----
async function loadDares(){
  try{ const {challenges}=await api('/api/dash/challenges');
    $('#p-dares').innerHTML=challenges.length?challenges.map(c=>`
      <div class="card">
        <div class="row">
          <div><b>${esc(c.code)}</b> <span class="tag ${c.full?'full':'live'}">${c.full?'filled':'live'}</span>
            <div class="sub">${esc(c.title)} · by @${esc(c.creator)} · ${c.reward} cr · slots ${c.slots[0]}/${c.maxWinners} · ${c.subs} proofs · ${c.pending} pending</div></div>
          <button class="btn btn-out btn-sm" data-del="${c.id}" style="border-color:var(--red);color:var(--red)">Delete & refund</button>
        </div>
      </div>`).join(''):'<div class="loading">No dares.</div>';
    $('#p-dares').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      if(!confirm('Delete this dare? Unspent escrow is refunded to the creator.')) return;
      try{ const r=await api('/api/dash/challenge/'+b.dataset.del+'/delete',{method:'POST'}); alert('Deleted · refunded '+r.refunded+' cr'); loadDares(); }catch(e){alert(e.message);} });
  }catch(e){ $('#p-dares').innerHTML=`<div class="loading">${esc(e.message)}</div>`; }
}

// ---- ledger ----
async function loadLedger(){
  try{ const {txns}=await api('/api/dash/txns');
    $('#p-ledger').innerHTML=txns.length?`<div class="ledger">`+txns.map(t=>`
      <div class="l"><div><span class="mono t-${esc(t.type)}" style="font-weight:600">${esc(t.type)}</span>
        <span class="muted">${esc(t.from)} → ${esc(t.to)}</span><div class="sub">${esc(t.note||'')} · ${fdate(t.at)}</div></div>
        <div class="amt t-${esc(t.type)}">${t.amount} cr</div></div>`).join('')+`</div>`:'<div class="loading">No transactions yet.</div>';
  }catch(e){ $('#p-ledger').innerHTML=`<div class="loading">${esc(e.message)}</div>`; }
}

// boot
if(TOKEN) showApp(); else $('#login').style.display='flex';
</script>
</body>
</html>
