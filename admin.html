<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Bountly · Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d10; --surface:#15181d; --surface2:#1b1f26; --line:#262b33; --line2:#323843;
  --txt:#e7e9ea; --muted:#7d838d; --lime:#C6F24E; --red:#f4212e; --amber:#ff9f45; --blue:#1d9bf0;
  --mono:'JetBrains Mono',monospace; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit}
.mono{font-family:var(--mono)}

/* login */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.brand .m{width:34px;height:34px;border-radius:50%;background:var(--lime);display:grid;place-items:center}
.brand .m svg{width:60%}
.brand b{font-size:18px;font-weight:900;letter-spacing:-.02em}
.login-card h1{font-size:18px;margin-bottom:6px}
.login-card p{color:var(--muted);font-size:13px;margin-bottom:20px}
input,select{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 13px;font-family:var(--sans);font-size:14px;outline:none}
input:focus{border-color:var(--lime)}
.btn{font-family:var(--sans);font-weight:700;font-size:13px;border:none;cursor:pointer;padding:10px 16px;border-radius:9px;transition:.15s;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn-lime{background:var(--lime);color:#000}
.btn-out{background:transparent;border:1px solid var(--line2);color:var(--txt)}
.btn-sm{padding:7px 12px;font-size:12px}
.btn:active{transform:scale(.97)}
.err{color:var(--red);font-size:13px;margin-top:12px;min-height:18px}

/* app */
#app{display:none;max-width:1100px;margin:0 auto;padding:20px 18px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px}
.tabs button{font-family:var(--sans);font-weight:600;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:8px 15px;border-radius:99px;cursor:pointer}
.tabs button.active{background:var(--lime);color:#000;border-color:var(--lime)}
.panel{display:none}.panel.active{display:block}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat .v.lime{color:var(--lime)}.stat .v.amber{color:var(--amber)}.stat .v.red{color:var(--red)}
.stat .k{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:99px;font-weight:600}
.tag.live{color:var(--lime);background:rgba(198,242,78,.1)}
.tag.full{color:var(--red);background:rgba(244,33,46,.1)}
.tag.admin{color:var(--blue);background:rgba(29,155,240,.12)}
.tag.banned{color:var(--red);background:rgba(244,33,46,.12)}
.muted{color:var(--muted)}
.sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px}
h2.sec{font-size:16px;margin-bottom:14px}
.sumbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.sumbar .chip{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:13px}
.sumbar .chip b{font-size:17px;font-weight:800;margin-right:6px}
.sumbar .chip.lime b{color:var(--lime)} .sumbar .chip.red b{color:var(--red)} .sumbar .chip.amber b{color:var(--amber)} .sumbar .chip.blue b{color:var(--blue)}
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ledger .l{display:flex;justify-content:space-between;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line);font-size:13px}
.ledger .l:last-child{border-bottom:none}
.amt{font-weight:700}
.t-payout,.t-refund{color:var(--lime)} .t-fee,.t-commission{color:var(--amber)} .t-escrow{color:var(--blue)} .t-admin-adjust{color:var(--muted)}
video{width:100%;max-width:260px;border-radius:10px;margin-top:8px;background:#000}
.loading{color:var(--muted);text-align:center;padding:30px}
input[type=number]{width:90px;display:inline-block}

/* charts */
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
@media(max-width:760px){.charts{grid-template-columns:1fr}}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.chart-card.wide{grid-column:1/-1}
.chart-card h3{font-size:13px;font-weight:700;margin-bottom:2px}
.chart-card .cap{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:16px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px}
.bars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%;position:relative}
.bars .col .b{width:100%;border-radius:3px 3px 0 0;transition:height .5s cubic-bezier(.2,.8,.2,1);min-height:2px}
.bars .col .lab{font-family:var(--mono);font-size:9px;color:var(--muted);text-align:center;margin-top:6px;white-space:nowrap}
.donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.flow-row{margin-top:6px}
.flow-row .fr{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}
.flow-row .bar{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-bottom:16px}
.flow-row .bar span{display:block;height:100%;border-radius:99px;transition:width .6s ease}

/* tab count badges */
.cnt{display:none;font-family:var(--mono);font-size:11px;font-weight:600;background:var(--surface2);color:var(--muted);padding:1px 7px;border-radius:99px;margin-left:4px;min-width:18px;text-align:center}
.cnt.show{display:inline-block}
.tabs button.active .cnt{background:rgba(0,0,0,.22);color:#000}
.cnt.alert{background:rgba(255,159,69,.18);color:var(--amber)}

/* interactive bars */
.bars .col{cursor:pointer}
.bars .col .b{transition:height .5s cubic-bezier(.2,.8,.2,1),filter .15s,transform .15s}
.bars .col:hover .b{filter:brightness(1.25) saturate(1.2)}
.bars .col:hover{transform:translateY(-2px)}
.bars .col.hot .b{box-shadow:0 0 16px rgba(198,242,78,.4)}

/* chart tooltip */
#tip{position:fixed;pointer-events:none;z-index:999;background:#0c0e11;border:1px solid var(--line2);border-radius:9px;padding:8px 11px;font-size:12px;opacity:0;transition:opacity .12s;transform:translate(-50%,-115%);white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#tip.show{opacity:1}
#tip .d{color:var(--lime);font-weight:700} #tip .p{color:var(--blue);font-weight:700}
#tip b{font-family:var(--mono)}

/* donut interactivity */
#ch-donut svg circle[data-seg]{cursor:pointer;transition:stroke-width .18s,opacity .18s}
#ch-donut.has-hover svg circle[data-seg]{opacity:.4}
#ch-donut.has-hover svg circle[data-seg].on{opacity:1;stroke-width:26}
.legend span[data-leg]{cursor:pointer;transition:.15s;border-radius:6px;padding:2px 6px;margin:-2px -6px}
.legend span[data-leg]:hover{background:var(--surface2)}
.flow-row .fr{transition:.15s} .flow-row .bar span{cursor:pointer}
.flow-row .bar:hover span{filter:brightness(1.2)}
.stat{transition:transform .15s,border-color .15s}
.stat:hover{transform:translateY(-2px);border-color:var(--line2)}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="brand"><span class="m"><svg viewBox="0 0 24 24" fill="none"><path d="M6 4h7a4 4 0 0 1 0 8H6zM6 12h8a4 4 0 0 1 0 8H6zM6 4v16" stroke="#000" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg></span><b>Bountly</b></div>
    <h1>Admin dashboard</h1>
    <p>Enter the dashboard password to continue.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <div style="height:12px"></div>
    <button class="btn btn-lime" id="login-btn" style="width:100%">Log in</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand"><span class="m"><svg viewBox="0 0 24 24" fill="none"><path d="M6 4h7a4 4 0 0 1 0 8H6zM6 12h8a4 4 0 0 1 0 8H6zM6 4v16" stroke="#000" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg></span><b>Bountly · Admin</b></div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn btn-out btn-sm" id="refresh">↻ Refresh</button>
      <button class="btn btn-out btn-sm" id="logout">Log out</button>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="active" data-p="overview">Overview</button>
    <button data-p="queue">Review <span class="cnt" id="cnt-queue"></span></button>
    <button data-p="users">Users <span class="cnt" id="cnt-users"></span></button>
    <button data-p="dares">Dares <span class="cnt" id="cnt-dares"></span></button>
    <button data-p="ledger">Ledger <span class="cnt" id="cnt-ledger"></span></button>
  </div>

  <div class="panel active" data-panel="overview" id="p-overview"><div class="loading">Loading…</div></div>
  <div class="panel" data-panel="queue" id="p-queue"><div class="loading">Loading…</div></div>
  <div class="panel" data-panel="users" id="p-users"><div class="loading">Loading…</div></div>
  <div class="panel" data-panel="dares" id="p-dares"><div class="loading">Loading…</div></div>
  <div class="panel" data-panel="ledger" id="p-ledger"><div class="loading">Loading…</div></div>
</div>

<div id="tip"></div>
<script>
const $=s=>document.querySelector(s);
let TOKEN=localStorage.getItem('bountly_dash')||'';
let current='overview';

async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN,...(opts.headers||{})}});
  if(r.status===401){ logout(); throw new Error('Session expired — log in again'); }
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
  return d;
}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fdate=ms=>{const d=new Date(ms);return d.toLocaleDateString()+' '+d.toLocaleTimeString().slice(0,5);};

// ---- auth ----
async function login(){
  const pw=$('#pw').value; $('#login-err').textContent='';
  try{
    const r=await fetch('/api/dash/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error||'Login failed');
    TOKEN=d.token; localStorage.setItem('bountly_dash',TOKEN);
    showApp();
  }catch(e){ $('#login-err').textContent=e.message; }
}
function logout(){ TOKEN=''; localStorage.removeItem('bountly_dash'); $('#app').style.display='none'; $('#login').style.display='flex'; }
function showApp(){ $('#login').style.display='none'; $('#app').style.display='block'; load(current); }

$('#login-btn').onclick=login;
$('#pw').addEventListener('keydown',e=>{ if(e.key==='Enter') login(); });
$('#logout').onclick=logout;
$('#refresh').onclick=()=>load(current);
$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  current=b.dataset.p;
  $('#tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.dataset.panel===current));
  load(current);
});

function load(which){
  if(which==='overview') loadOverview();
  else if(which==='queue') loadQueue();
  else if(which==='users') loadUsers();
  else if(which==='dares') loadDares();
  else if(which==='ledger') loadLedger();
}

// ---- overview ----
async function loadOverview(){
  try{ const {overview:o}=await api('/api/dash/overview');
    $('#p-overview').innerHTML=`
      <div class="grid">
        <div class="stat"><div class="v lime">${o.creditsInPlay}</div><div class="k">Credits in play</div></div>
        <div class="stat"><div class="v">${o.users}</div><div class="k">Users</div></div>
        <div class="stat"><div class="v red">${o.banned}</div><div class="k">Banned</div></div>
        <div class="stat"><div class="v">${o.challenges}</div><div class="k">Dares total</div></div>
        <div class="stat"><div class="v lime">${o.open}</div><div class="k">Open dares</div></div>
        <div class="stat"><div class="v">${o.filled}</div><div class="k">Filled dares</div></div>
        <div class="stat"><div class="v amber">${o.pending}</div><div class="k">Pending review</div></div>
        <div class="stat"><div class="v lime">${o.paidOut}</div><div class="k">Paid out</div></div>
        <div class="stat"><div class="v amber">${o.fees}</div><div class="k">Fees earned</div></div>
        <div class="stat"><div class="v">${o.refunded}</div><div class="k">Refunded</div></div>
      </div>
      <div class="charts">
        <div class="chart-card wide">
          <h3>Activity</h3><div class="cap">Dares &amp; proofs · last 14 days</div>
          <div class="bars" id="ch-activity"></div>
          <div class="legend"><span><i style="background:var(--lime)"></i>Dares</span><span><i style="background:var(--blue)"></i>Proofs</span></div>
        </div>
        <div class="chart-card">
          <h3>Credit flows</h3><div class="cap">Where credits moved</div>
          <div class="flow-row" id="ch-flows"></div>
        </div>
        <div class="chart-card">
          <h3>Proof status</h3><div class="cap">All submissions</div>
          <div class="donut-wrap"><div id="ch-donut"></div><div class="legend" id="ch-donut-leg" style="flex-direction:column;gap:8px;margin-top:0"></div></div>
        </div>
      </div>`;
    renderActivity(o.charts.activity);
    renderFlows(o.charts.flows);
    renderDonut(o.charts.proofStatus);
    setBadges(o);
  }catch(e){ $('#p-overview').innerHTML=`<div class="loading">${esc(e.message)}</div>`; }
}

function setBadges(o){
  const set=(id,n,alert)=>{ const el=$('#'+id); if(!el)return; el.textContent=n; el.classList.add('show'); el.classList.toggle('alert',!!alert&&n>0); };
  set('cnt-queue',o.pending,true);
  set('cnt-users',o.users);
  set('cnt-dares',o.challenges);
  set('cnt-ledger',o.txnsCount);
}

function renderActivity(a){
  const max=Math.max(1,...a.dares,...a.proofs);
  $('#ch-activity').innerHTML=a.labels.map((lab,i)=>`
    <div class="col" data-i="${i}">
      <div class="b" style="height:${(a.proofs[i]/max*100)}%;background:var(--blue);opacity:.85"></div>
      <div class="b" style="height:${(a.dares[i]/max*100)}%;background:var(--lime)"></div>
      <div class="lab">${lab}</div>
    </div>`).join('');
  const tip=$('#tip');
  $('#ch-activity').querySelectorAll('.col').forEach(col=>{
    const i=+col.dataset.i;
    col.addEventListener('mousemove',e=>{
      col.classList.add('hot');
      tip.innerHTML=`<div style="color:var(--muted);margin-bottom:3px">${a.labels[i]}</div><span class="d">● <b>${a.dares[i]}</b> dares</span> &nbsp; <span class="p">● <b>${a.proofs[i]}</b> proofs</span>`;
      tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; tip.classList.add('show');
    });
    col.addEventListener('mouseleave',()=>{ col.classList.remove('hot'); tip.classList.remove('show'); });
  });
}
function renderFlows(f){
  const rows=[['Paid out',f.paidOut,'var(--lime)'],['Fees earned',f.fees,'var(--amber)'],['Refunded',f.refunded,'var(--blue)']];
  const max=Math.max(1,f.paidOut,f.fees,f.refunded);
  $('#ch-flows').innerHTML=rows.map(([k,v,c])=>`
    <div class="fr"><span class="muted">${k}</span><b style="color:${c}">${v} cr</b></div>
    <div class="bar"><span style="width:0;background:${c}" data-w="${(v/max*100)}"></span></div>`).join('');
  requestAnimationFrame(()=>$('#ch-flows').querySelectorAll('.bar span').forEach(s=>s.style.width=s.dataset.w+'%'));
}
function renderDonut(s){
  const parts=[['Approved',s.approved,'var(--lime)','approved'],['Rejected',s.rejected,'var(--red)','rejected'],['Pending',s.pending,'var(--amber)','pending']];
  const total=Math.max(1,s.approved+s.rejected+s.pending);
  let acc=0; const segs=parts.map(([k,v,c,id])=>{ const frac=v/total, start=acc; acc+=frac; return {k,v,c,id,start,frac}; });
  const r=52,cx=64,cy=64,sw=20,C=2*Math.PI*r;
  const circles=segs.filter(s2=>s2.v>0).map(s2=>`<circle data-seg="${s2.id}" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s2.c}" stroke-width="${sw}" stroke-dasharray="${s2.frac*C} ${C}" stroke-dashoffset="${-s2.start*C}" transform="rotate(-90 ${cx} ${cy})"/>`).join('');
  const dwrap=$('#ch-donut');
  dwrap.innerHTML=`<svg width="128" height="128" viewBox="0 0 128 128">${circles||`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line2)" stroke-width="${sw}"/>`}<text id="donut-c" x="64" y="60" text-anchor="middle" fill="#e7e9ea" font-size="22" font-weight="800" font-family="Inter">${s.approved+s.rejected+s.pending}</text><text id="donut-l" x="64" y="78" text-anchor="middle" fill="#7d838d" font-size="10" font-family="JetBrains Mono">PROOFS</text></svg>`;
  $('#ch-donut-leg').innerHTML=parts.map(([k,v,c,id])=>`<span data-leg="${id}"><i style="background:${c}"></i>${k} · <b style="color:var(--txt)">${v}</b></span>`).join('');
  // hover linking legend <-> segment + center label
  const setHover=(id,on)=>{
    dwrap.classList.toggle('has-hover',on);
    dwrap.querySelectorAll('circle[data-seg]').forEach(ci=>ci.classList.toggle('on',on&&ci.dataset.seg===id));
    const seg=segs.find(x=>x.id===id);
    const cEl=document.getElementById('donut-c'), lEl=document.getElementById('donut-l');
    if(on&&seg&&cEl){ cEl.textContent=seg.v; cEl.setAttribute('fill',getComputedStyle(document.documentElement).getPropertyValue(seg.c.replace('var(','').replace(')',''))||'#e7e9ea'); lEl.textContent=seg.k.toUpperCase(); }
    else if(cEl){ cEl.textContent=s.approved+s.rejected+s.pending; cEl.setAttribute('fill','#e7e9ea'); lEl.textContent='PROOFS'; }
  };
  dwrap.querySelectorAll('circle[data-seg]').forEach(ci=>{
    ci.addEventListener('mouseenter',()=>setHover(ci.dataset.seg,true));
    ci.addEventListener('mouseleave',()=>setHover(null,false));
  });
  $('#ch-donut-leg').querySelectorAll('span[data-leg]').forEach(sp=>{
    sp.addEventListener('mouseenter',()=>setHover(sp.dataset.leg,true));
    sp.addEventListener('mouseleave',()=>setHover(null,false));
  });
}

// ---- queue / review ----
async function loadQueue(){
  try{ const {queue}=await api('/api/dash/queue');
    const sum=`<div class="sumbar"><div class="chip amber"><b>${queue.length}</b>waiting for review</div></div>`;
    $('#p-queue').innerHTML=sum+(queue.length?queue.map((s,i)=>`
      <div class="card">
        <div class="row"><div><b>#${i+1} · ${esc(s.code)}</b><div class="sub">${esc(s.title)} · by @${esc(s.player)} · ${esc(s.file)}</div></div></div>
        ${s.video?`<video controls src="/uploads/${esc(s.video)}"></video>`:'<div class="sub">(no video file)</div>'}
        <div style="display:flex;gap:8px;margin-top:12px">
          <button class="btn btn-lime btn-sm" data-ap="${s.id}">Approve</button>
          <input id="rr-${s.id}" placeholder="reject reason" style="flex:1;min-width:120px">
          <button class="btn btn-out btn-sm" data-rj="${s.id}" style="border-color:var(--red);color:var(--red)">Reject</button>
        </div>
      </div>`).join(''):'<div class="loading">No proofs waiting for review. ✓</div>');
    $('#p-queue').querySelectorAll('[data-ap]').forEach(b=>b.onclick=async()=>{
      try{ const r=await api('/api/dash/approve/'+b.dataset.ap,{method:'POST'}); alert(r.winner?'Approved — winner paid!':'Approved (slot was taken)'); loadQueue(); }catch(e){alert(e.message);} });
    $('#p-queue').querySelectorAll('[data-rj]').forEach(b=>b.onclick=async()=>{
      const reason=$('#rr-'+b.dataset.rj).value.trim(); if(!reason) return alert('Enter a reject reason');
      try{ await api('/api/dash/reject/'+b.dataset.rj,{method:'POST',body:JSON.stringify({reason})}); loadQueue(); }catch(e){alert(e.message);} });
  }catch(e){ $('#p-queue').innerHTML=`<div class="loading">${esc(e.message)}</div>`; }
}

// ---- users ----
async function loadUsers(){
  try{ const {users}=await api('/api/dash/users');
    const banned=users.filter(u=>u.banned).length, admins=users.filter(u=>u.isAdmin).length;
    const sum=`<div class="sumbar"><div class="chip"><b>${users.length}</b>users</div><div class="chip red"><b>${banned}</b>banned</div><div class="chip blue"><b>${admins}</b>admins</div></div>`;
    $('#p-users').innerHTML=sum+users.map(x=>`
      <div class="card">
        <div class="row">
          <div><b>@${esc(x.username)}</b> ${x.isAdmin?'<span class="tag admin">admin</span>':''} ${x.banned?'<span class="tag banned">banned</span>':''}
            <div class="sub">id ${esc(x.id)} · ${x.credits} cr · ${x.wins} wins · ${x.posted} dares · ${x.subs} proofs · ${x.earned} cr earned</div></div>
        </div>
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
          <input type="number" id="cr-${x.id}" value="${x.credits}" ${x.isAdmin?'disabled':''}>
          <button class="btn btn-out btn-sm" data-cr="${x.id}" ${x.isAdmin?'disabled':''}>Set credits</button>
          ${x.isAdmin?'':`<button class="btn btn-sm ${x.banned?'btn-lime':'btn-out'}" data-ban="${x.id}">${x.banned?'Unban':'Ban'}</button>`}
        </div>
      </div>`).join('');
    $('#p-users').querySelectorAll('[data-cr]').forEach(b=>b.onclick=async()=>{
      const v=$('#cr-'+b.dataset.cr).value;
      try{ await api('/api/dash/credits/'+encodeURIComponent(b.dataset.cr),{method:'POST',body:JSON.stringify({credits:+v})}); loadUsers(); }catch(e){alert(e.message);} });
    $('#p-users').querySelectorAll('[data-ban]').forEach(b=>b.onclick=async()=>{
      try{ const r=await api('/api/dash/ban/'+encodeURIComponent(b.dataset.ban),{method:'POST'}); loadUsers(); }catch(e){alert(e.message);} });
  }catch(e){ $('#p-users').innerHTML=`<div class="loading">${esc(e.message)}</div>`; }
}

// ---- dares ----
async function loadDares(){
  try{ const {challenges}=await api('/api/dash/challenges');
    const open=challenges.filter(c=>!c.full).length, filled=challenges.length-open, totalReward=challenges.reduce((a,c)=>a+c.reward*c.maxWinners,0);
    const sum=`<div class="sumbar"><div class="chip"><b>${challenges.length}</b>dares</div><div class="chip lime"><b>${open}</b>open</div><div class="chip"><b>${filled}</b>filled</div><div class="chip amber"><b>${totalReward}</b>cr in pool</div></div>`;
    $('#p-dares').innerHTML=sum+(challenges.length?challenges.map(c=>`
      <div class="card">
        <div class="row">
          <div><b>${esc(c.code)}</b> <span class="tag ${c.full?'full':'live'}">${c.full?'filled':'live'}</span>
            <div class="sub">${esc(c.title)} · by @${esc(c.creator)} · ${c.reward} cr · slots ${c.slots[0]}/${c.maxWinners} · ${c.subs} proofs · ${c.pending} pending</div></div>
          <button class="btn btn-out btn-sm" data-del="${c.id}" style="border-color:var(--red);color:var(--red)">Delete & refund</button>
        </div>
      </div>`).join(''):'<div class="loading">No dares.</div>');
    $('#p-dares').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      if(!confirm('Delete this dare? Unspent escrow is refunded to the creator.')) return;
      try{ const r=await api('/api/dash/challenge/'+b.dataset.del+'/delete',{method:'POST'}); alert('Deleted · refunded '+r.refunded+' cr'); loadDares(); }catch(e){alert(e.message);} });
  }catch(e){ $('#p-dares').innerHTML=`<div class="loading">${esc(e.message)}</div>`; }
}

// ---- ledger ----
async function loadLedger(){
  try{ const {txns}=await api('/api/dash/txns');
    const sum=`<div class="sumbar"><div class="chip"><b>${txns.length}</b>transactions</div></div>`;
    $('#p-ledger').innerHTML=sum+(txns.length?`<div class="ledger">`+txns.map(t=>`
      <div class="l"><div><span class="mono t-${esc(t.type)}" style="font-weight:600">${esc(t.type)}</span>
        <span class="muted">${esc(t.from)} → ${esc(t.to)}</span><div class="sub">${esc(t.note||'')} · ${fdate(t.at)}</div></div>
        <div class="amt t-${esc(t.type)}">${t.amount} cr</div></div>`).join('')+`</div>`:'<div class="loading">No transactions yet.</div>');
  }catch(e){ $('#p-ledger').innerHTML=`<div class="loading">${esc(e.message)}</div>`; }
}

// boot
if(TOKEN) showApp(); else $('#login').style.display='flex';
</script>
</body>
</html>
